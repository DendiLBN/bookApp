services:
  mongo:
    image: mongo:7
    container_name: booknest-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: booknest
      MONGO_INITDB_ROOT_PASSWORD: booknest
      MONGO_INITDB_DATABASE: booknest
    ports:
      - "27017:27017"
    volumes:
      - booknest-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1.0.2
    container_name: booknest-mongo-express
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: booknest
      ME_CONFIG_MONGODB_ADMINPASSWORD: booknest
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "8081:8081"

volumes:
  booknest-mongo-data:
